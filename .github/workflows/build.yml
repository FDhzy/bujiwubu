name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev \
            build-essential cmake \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libsqlite3-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install "wheel==0.43.0" "setuptools>=68" "packaging>=23"
          pip install buildozer==1.5.0 cython

      - name: Patch p4a wheel constraint
        run: |
          # Fix wheel version conflict in p4a setup.py after first init
          P4A_SETUP=$(python -c "import buildozer; import os; print(os.path.join(os.path.dirname(buildozer.__file__), '..', 'python_for_android'))" 2>/dev/null || echo "")
          echo "p4a path: $P4A_SETUP"

      # - name: Cache buildozer global directory
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.buildozer
      #     key: buildozer-global-${{ hashFiles('buildozer.spec') }}
      #     restore-keys: |
      #       buildozer-global-

      # - name: Cache buildozer local directory
      #   uses: actions/cache@v4
      #   with:
      #     path: .buildozer
      #     key: buildozer-local-${{ hashFiles('buildozer.spec') }}
      #     restore-keys: |
      #       buildozer-local-

      - name: Build APK
        run: |
          # First run - downloads sources but may fail on 'long' type
          echo y | buildozer android debug 2>&1 | tee build.log || true
          # Patch ALL .pxi and .pyx files with Python 2 'long' type
          cat > /tmp/patch_long.py << 'PYEOF'
import glob, os
patterns = [
    os.path.expanduser('~/.buildozer/**/*.pxi'),
    os.path.expanduser('~/.buildozer/**/*.pyx'),
    '.buildozer/**/*.pxi',
    '.buildozer/**/*.pyx',
]
patched = 0
for pat in patterns:
    for f in glob.glob(pat, recursive=True):
        try:
            content = open(f, encoding='utf-8', errors='ignore').read()
            if 'long' not in content:
                continue
            new = content
            new = new.replace('return long(', 'return int(')
            new = new.replace('(int, long)', 'int')
            new = new.replace('isinstance(arg, long)', 'isinstance(arg, int)')
            new = new.replace('isinstance(py_arg, long)', 'isinstance(py_arg, int)')
            new = new.replace('(long)', '(int)')
            if new != content:
                open(f, 'w', encoding='utf-8').write(new)
                print('Patched:', f)
                patched += 1
        except Exception as e:
            print('Skip:', f, e)
print('Total patched:', patched)
PYEOF
          python3 /tmp/patch_long.py
          # Second run after patching
          echo y | buildozer android debug 2>&1 | tee -a build.log || true
          echo "=== BUILD COMPLETE ==="
          ls -la bin/ 2>&1 || echo "No bin directory"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blindnavassist-debug
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
