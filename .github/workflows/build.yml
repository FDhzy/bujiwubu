name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev \
            build-essential cmake \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libsqlite3-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install "wheel==0.43.0" "setuptools>=68" "packaging>=23"
          pip install buildozer==1.5.0 cython

      - name: Patch p4a wheel constraint
        run: |
          # Fix wheel version conflict in p4a setup.py after first init
          P4A_SETUP=$(python -c "import buildozer; import os; print(os.path.join(os.path.dirname(buildozer.__file__), '..', 'python_for_android'))" 2>/dev/null || echo "")
          echo "p4a path: $P4A_SETUP"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-local-

      - name: Build APK
        run: |
          # First run - will fail on pyjnius 'long' issue, but downloads sources
          echo y | buildozer android debug 2>&1 | tee build.log || true
          # Patch ALL pyjnius .pxi files that use 'long' (Python 2 type)
          find ~/.buildozer .buildozer -name '*.pxi' -path '*/jnius/*' 2>/dev/null | while read f; do
            if grep -q 'isinstance.*long' "$f"; then
              sed -i 's/isinstance(\(.*\), long)/isinstance(\1, int)/g' "$f"
              sed -i 's/isinstance(\(.*\), (int, long))/isinstance(\1, int)/g' "$f"
              echo "Patched: $f"
            fi
          done
          # Second run after patch
          echo y | buildozer android debug 2>&1 | tee -a build.log || true
          echo "=== BUILD COMPLETE ==="
          ls -la bin/ 2>&1 || echo "No bin directory"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blindnavassist-debug
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
